<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elevate Post Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ds/colors_and_type.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--erg-paper);font-family:var(--font-body);color:var(--erg-ink);-webkit-font-smoothing:antialiased}
a{color:var(--erg-blue)}a:hover{color:var(--erg-aqua-deep)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- shared bits ---------- */
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:var(--tracking-brand);text-transform:uppercase;color:var(--erg-aqua-deep);display:block}
.btn{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:13px 22px;border-radius:var(--r-md);transition:all var(--dur) var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn--aqua{background:var(--erg-aqua);color:var(--erg-blue)}
.btn--aqua:hover{background:var(--erg-aqua-soft);box-shadow:0 8px 24px rgba(0,251,240,.3)}
.btn--aqua:active{transform:scale(.98)}
.btn--ghost{background:transparent;color:var(--erg-blue);border:1.5px solid var(--erg-line-strong)}
.btn--ghost:hover{border-color:var(--erg-blue);background:var(--erg-white)}
.btn--sm{padding:9px 15px;font-size:11.5px}
.sec-title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(22px,3vw,32px);letter-spacing:.005em;color:var(--erg-blue);margin-bottom:28px}
.hint{font-size:12px;line-height:1.5;color:var(--erg-muted);margin-top:8px}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4vw,40px);background:var(--erg-blue);border-bottom:2px solid var(--erg-aqua)}
.nav__brand{display:flex;align-items:center;gap:14px;min-width:0}
.nav__brand img{height:19px;width:auto;opacity:.96}
.nav__tool{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:var(--tracking-brand);text-transform:uppercase;color:var(--erg-aqua);padding-left:14px;border-left:1px solid rgba(255,255,255,.2);white-space:nowrap}
.nav__links{display:flex;align-items:center;gap:6px}
.nav__links>button{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);padding:9px 13px;border-radius:var(--r-md);transition:color var(--dur) var(--ease),background var(--dur) var(--ease)}
.nav__links>button:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav__links>button.is-on{color:var(--erg-aqua)}
.nav__me{padding:0!important;width:34px;height:34px;border-radius:var(--r-pill);overflow:hidden;margin-left:8px;box-shadow:0 0 0 2px var(--erg-aqua)}
.nav__me img{width:100%;height:100%;object-fit:cover}

/* ---------- landing ---------- */
.landing{flex:1}
.hero{background:var(--erg-blue);background-image:radial-gradient(90% 120% at 12% -10%,var(--erg-blue-700) 0%,var(--erg-blue) 55%);color:#fff;padding:clamp(56px,9vw,104px) clamp(20px,6vw,72px) clamp(64px,10vw,112px)}
.hero .eyebrow{color:var(--erg-aqua)}
.hero h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(34px,6.4vw,74px);line-height:1.02;letter-spacing:.005em;color:#fff;margin:18px 0 0;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--erg-aqua)}
.hero .lead{max-width:62ch;margin-top:22px;font-size:clamp(15px,1.5vw,18px);line-height:1.65;color:rgba(255,255,255,.76)}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero .btn--ghost{color:#fff;border-color:rgba(255,255,255,.3)}
.hero .btn--ghost:hover{border-color:var(--erg-aqua);background:rgba(255,255,255,.06);color:#fff}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:1px;background:var(--erg-line);border-bottom:1px solid var(--erg-line)}
.step{background:var(--erg-white);padding:clamp(26px,3.6vw,42px)}
.step__n{font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--erg-aqua-deep)}
.step h3{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.02em;color:var(--erg-blue);margin:14px 0 8px}
.step p{font-size:14px;line-height:1.6;color:var(--erg-slate);margin:0}

.cats{padding:clamp(44px,7vw,88px) clamp(20px,6vw,72px)}
.cats__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:20px}
.catcard{text-align:left;background:var(--erg-white);border:1px solid var(--erg-line);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow-xs);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease);display:flex;flex-direction:column;gap:8px}
.catcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--erg-aqua)}
.catcard__n{font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--erg-aqua-deep)}
.catcard h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:19px;letter-spacing:.005em;color:var(--erg-blue)}
.catcard p{font-size:14px;line-height:1.6;color:var(--erg-slate);margin:0;flex:1}
.catcard__go{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--erg-blue);margin-top:10px}

.foot{background:var(--erg-blue);color:rgba(255,255,255,.62);padding:32px clamp(20px,6vw,72px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;font-size:12.5px}
.foot__erg{height:17px;width:auto}
.foot span{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.foot__real{height:11px;width:auto;display:inline-block}

/* ---------- page shell ---------- */
.page{flex:1;padding:clamp(28px,5vw,56px) clamp(20px,6vw,72px) 80px;max-width:1280px;width:100%;margin:0 auto}
.page--narrow{max-width:820px}
.page__head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px}
.page__title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(26px,4vw,40px);letter-spacing:.005em;color:var(--erg-blue);margin-top:10px}
.page__sub{color:var(--erg-slate);font-size:15px;line-height:1.6;margin:12px 0 28px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-display);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:9px 15px;border-radius:var(--r-pill);border:1px solid var(--erg-line-strong);color:var(--erg-slate);background:var(--erg-white);transition:all var(--dur) var(--ease)}
.chip:hover{border-color:var(--erg-blue);color:var(--erg-blue)}
.chip.is-on{background:var(--erg-blue);border-color:var(--erg-blue);color:#fff}

/* ---------- template grid ---------- */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:22px}
.tpl{background:var(--erg-white);border:1px solid var(--erg-line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-xs);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);display:flex;flex-direction:column}
.tpl:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.mini{aspect-ratio:4/5;background:var(--erg-blue);background-image:radial-gradient(100% 80% at 20% 0%,var(--erg-blue-700) 0%,var(--erg-blue) 60%);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.mini__rule{width:34px;height:3px;background:var(--erg-aqua);border-radius:2px}
.mini__head{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:17px;line-height:1.12;letter-spacing:.005em;color:#fff;white-space:pre-line}
.tpl__body{padding:20px;display:flex;flex-direction:column;gap:7px;flex:1}
.tpl__cat{font-family:var(--font-display);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--erg-aqua-deep)}
.tpl__body h3{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:16px;letter-spacing:.01em;color:var(--erg-blue)}
.tpl__body p{font-size:13.5px;line-height:1.55;color:var(--erg-slate);margin:0;flex:1}
.tpl__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:14px;border-top:1px solid var(--erg-line)}
.tpl__meta{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--erg-muted)}

/* ---------- profile ---------- */
.profile{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:32px;background:var(--erg-white);border:1px solid var(--erg-line);border-radius:var(--r-lg);padding:28px;margin-bottom:24px;box-shadow:var(--shadow-xs)}
.profile__face{display:flex;flex-direction:column;gap:12px;align-items:center}
.profile__face img{width:140px;height:140px;object-fit:cover;border-radius:var(--r-pill);box-shadow:0 0 0 3px var(--erg-aqua)}
.profile__fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px;align-content:start}
.field{display:flex;flex-direction:column;gap:6px}
.field__label{font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--erg-slate)}
.field input,.field textarea{font-family:var(--font-body);font-size:14px;color:var(--erg-ink);background:var(--erg-paper);border:1px solid var(--erg-line-strong);border-radius:var(--r-md);padding:10px 12px;width:100%;line-height:1.5;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--erg-aqua-deep);box-shadow:var(--glow-aqua)}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--erg-slate)}
.check input{width:17px;height:17px;accent-color:var(--erg-aqua-deep)}

/* ---------- builder ---------- */
.builder{flex:1;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start;gap:0}
.editor{background:var(--erg-white);border-right:1px solid var(--erg-line);padding:24px clamp(18px,2vw,26px) 60px;min-height:calc(100vh - 62px);display:flex;flex-direction:column;gap:22px}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--erg-slate);align-self:flex-start}
.back:hover{color:var(--erg-blue)}
.editor__title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.005em;color:var(--erg-blue);margin-top:-14px}
.block{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--erg-line)}
.block--export{border-bottom:none;gap:10px}
.block__label{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--erg-blue)}
.block .hint{margin-top:0}
.seg{display:flex;gap:4px;background:var(--erg-mist);padding:4px;border-radius:var(--r-md)}
.seg__b{flex:1;font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:9px 6px;border-radius:6px;color:var(--erg-slate);transition:all var(--dur) var(--ease)}
.seg__b:hover{color:var(--erg-blue)}
.seg__b.is-on{background:var(--erg-blue);color:#fff}
.thumbs{display:flex;flex-direction:column;gap:5px}
.thumb{display:flex;align-items:center;gap:11px;text-align:left;padding:9px 11px;border-radius:var(--r-md);border:1px solid transparent;transition:all var(--dur) var(--ease)}
.thumb:hover{background:var(--erg-paper)}
.thumb.is-on{background:var(--erg-paper);border-color:var(--erg-aqua)}
.thumb__n{font-family:var(--font-display);font-weight:700;font-size:10.5px;color:var(--erg-white);background:var(--erg-blue);width:21px;height:21px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;flex:none}
.thumb.is-on .thumb__n{background:var(--erg-aqua-deep)}
.thumb__t{font-size:12.5px;color:var(--erg-slate);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.caption-box{font-size:13px;line-height:1.55;color:var(--erg-slate);background:var(--erg-paper);border:1px solid var(--erg-line);border-radius:var(--r-md);padding:12px;margin:0;white-space:pre-line;cursor:text}
.caption-tags{font-size:12.5px;line-height:1.5;color:var(--erg-aqua-deep);margin:0}
/* export sheet */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(3,3,40,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}
.sheet__box{background:var(--erg-white);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(880px,100%);max-height:86vh;overflow:auto;padding:26px}
.sheet__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sheet__title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.005em;color:var(--erg-blue);margin-top:8px}
.sheet__x{font-size:17px;color:var(--erg-slate);padding:4px 8px}
.sheet__x:hover{color:var(--erg-blue)}
.sheet__note{font-size:13.5px;line-height:1.6;color:var(--erg-slate);margin:14px 0 20px;max-width:64ch}
.sheet__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.shot{margin:0;border:1px solid var(--erg-line);border-radius:var(--r-md);overflow:hidden;background:var(--erg-paper)}
.shot img{width:100%;height:auto;display:block}
.shot figcaption{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--erg-muted)}
.shot figcaption a{color:var(--erg-aqua-deep);text-decoration:none}
.shot figcaption a:hover{color:var(--erg-blue)}
.busy{font-family:var(--font-display);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--erg-aqua-deep);margin:0}
.alts{display:flex;flex-direction:column;gap:6px}
.alt{text-align:left;font-size:12.5px;line-height:1.4;color:var(--erg-slate);background:var(--erg-paper);border:1px solid var(--erg-line);border-radius:var(--r-md);padding:9px 11px;transition:all var(--dur) var(--ease)}
.alt:hover{border-color:var(--erg-blue);color:var(--erg-blue)}
.alt.is-on{border-color:var(--erg-aqua-deep);background:var(--erg-aqua-tint);color:var(--erg-blue);font-weight:500}

.preview{padding:clamp(24px,4vw,48px) clamp(16px,4vw,48px) 72px;display:flex;justify-content:center;background:var(--erg-mist);min-height:calc(100vh - 62px)}
.phone{width:min(400px,100%);align-self:flex-start;background:#fff;border:1px solid #DBDBDB;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-sm);position:sticky;top:86px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.phone__bar{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:#fff}
.phone__who{display:flex;align-items:center;gap:11px}
.phone__face{width:33px;height:33px;border-radius:var(--r-pill);object-fit:cover;border:1px solid #DBDBDB}
.phone__handle{font-size:13.5px;font-weight:600;color:#262626;display:block;line-height:1.25}
.phone__loc{font-size:11.5px;color:#262626;display:block;line-height:1.25}
.phone__dots{color:#262626;letter-spacing:1px;font-size:15px}
.phone__stage{position:relative;width:100%;aspect-ratio:var(--ratio);overflow:hidden;background:#000}
.rail{display:flex;width:100%;height:100%;transition:transform var(--dur) var(--ease)}
.rail__cell{flex:0 0 100%;height:100%}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:8;width:26px;height:26px;border-radius:var(--r-pill);background:rgba(255,255,255,.9);color:#262626;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:2px;transition:background var(--dur) var(--ease)}
.arrow:hover{background:#fff}
.arrow--l{left:9px}.arrow--r{right:9px}
.phone__foot{background:#fff;padding:9px 13px 14px}
.phone__acts{display:flex;align-items:center;justify-content:space-between;position:relative}
.phone__acts-l{display:flex;align-items:center;gap:14px}
.ico{color:#262626}
.phone__pips{display:flex;align-items:center;justify-content:center;gap:4px;position:absolute;left:0;right:0;margin:0 auto;pointer-events:auto;width:fit-content}
.pip{width:6px;height:6px;border-radius:var(--r-pill);background:#C7C7C7;transition:background var(--dur) var(--ease);padding:0}
.pip.is-on{background:#0095F6}
.phone__cap{font-size:13.5px;line-height:1.4;color:#262626;margin:11px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.phone__cap b{font-weight:600;margin-right:5px}

/* ---------- story preview ---------- */
.story{position:relative;width:min(320px,100%);align-self:flex-start;background:#000;border-radius:10px;overflow:hidden;box-shadow:var(--shadow-lg);position:sticky;top:86px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.story__stage{position:relative;width:100%;aspect-ratio:var(--ratio);overflow:hidden;background:#000}
.story__bars{position:absolute;top:8px;left:8px;right:8px;z-index:9;display:flex;gap:3px}
.sbar{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.35);padding:0;transition:background var(--dur) var(--ease)}
.sbar.is-done,.sbar.is-on{background:#fff}
.story__top{position:absolute;top:20px;left:10px;right:10px;z-index:9;display:flex;align-items:center;gap:9px}
.story__face{width:28px;height:28px;border-radius:var(--r-pill);object-fit:cover;border:1px solid rgba(255,255,255,.5)}
.story__handle{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.story__x{margin-left:auto;color:#fff;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.story__bottom{position:absolute;bottom:10px;left:10px;right:10px;z-index:9;display:flex;align-items:center;gap:12px}
.story__reply{flex:1;font-size:13px;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.55);border-radius:var(--r-pill);padding:9px 15px}
.story__bottom .ico{color:#fff;width:22px;height:22px;flex:none}
/* scrims so the white story chrome reads over any colourway */
.story::before,.story::after{content:"";position:absolute;left:0;right:0;z-index:8;pointer-events:none}
.story::before{top:0;height:28%;background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.26) 50%,transparent 100%)}
.story::after{bottom:0;height:24%;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.24) 55%,transparent 100%)}
/* light colourways: flip the chrome instead of fighting it with a scrim */
.story.is-light::before{background:linear-gradient(to bottom,rgba(255,255,255,.62) 0%,rgba(255,255,255,.28) 50%,transparent 100%)}
.story.is-light::after{background:linear-gradient(to top,rgba(255,255,255,.62) 0%,rgba(255,255,255,.26) 55%,transparent 100%)}
.story.is-light .story__handle,.story.is-light .story__x,.story.is-light .story__bottom .ico{color:#1D1D1D;text-shadow:none}
.story.is-light .story__face{border-color:rgba(0,0,0,.28)}
.story.is-light .sbar{background:rgba(0,0,0,.28)}
.story.is-light .sbar.is-done,.story.is-light .sbar.is-on{background:#1D1D1D}
.story.is-light .story__reply{color:#1D1D1D;border-color:rgba(0,0,0,.5)}
.story .arrow{z-index:10}
/* keep slide copy clear of the story chrome */
.story .slide__body--top{padding-top:15cqw}
.story .slide__body--bottom{padding-bottom:19cqw}
.story .lockup{top:15cqw}

/* ---------- the slide itself ---------- */
.slide{position:relative;width:100%;height:100%;overflow:hidden;container-type:inline-size;background:var(--s-bg,var(--erg-blue))}
.slide__solid{position:absolute;inset:0;background:var(--s-bg);background-image:radial-gradient(105% 80% at 16% 0%,color-mix(in srgb,var(--s-ink) 9%,var(--s-bg)) 0%,transparent 62%)}
.mslot{position:absolute;inset:0}
.mslot__fill{width:100%;height:100%;object-fit:cover;display:block}
.mslot__empty{position:absolute;inset:0;background:linear-gradient(165deg,color-mix(in srgb,var(--s-ink) 12%,var(--s-bg)) 0%,var(--s-bg) 100%);display:flex;align-items:center;justify-content:center;padding:6cqw}
.mslot__hint{display:flex;flex-direction:column;align-items:center;gap:2cqw;color:color-mix(in srgb,var(--s-ink) 46%,transparent);text-align:center;max-width:70%}
.mslot__hint span{font-family:var(--font-display);font-weight:600;font-size:3cqw;letter-spacing:.08em;text-transform:uppercase}
.mslot__hintsub{font-family:var(--font-body)!important;font-weight:400!important;font-size:2.8cqw!important;letter-spacing:0!important;text-transform:none!important;color:color-mix(in srgb,var(--s-ink) 32%,transparent)}
.mslot.is-drag .mslot__empty{outline:2px solid var(--erg-aqua);outline-offset:-2cqw}
.mslot.is-drag .mslot__hint{color:var(--erg-aqua)}
.mslot__badge{position:absolute;top:3cqw;left:3cqw;z-index:6;background:var(--erg-aqua);color:var(--erg-blue);font-family:var(--font-display);font-weight:700;font-size:2.4cqw;letter-spacing:.08em;text-transform:uppercase;padding:1.4cqw 2.6cqw;border-radius:var(--r-pill);opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none}
.slide:hover .mslot__badge{opacity:1}

.slide__scrim{position:absolute;inset:0;z-index:1;pointer-events:none}
.slide__scrim[data-pos="bottom"]{background:linear-gradient(to top,color-mix(in srgb,var(--s-scrim) 88%,transparent) 0%,color-mix(in srgb,var(--s-scrim) 44%,transparent) 42%,transparent 72%)}
.slide__scrim[data-pos="top"]{background:linear-gradient(to bottom,color-mix(in srgb,var(--s-scrim) 88%,transparent) 0%,color-mix(in srgb,var(--s-scrim) 44%,transparent) 44%,transparent 74%)}
.slide__scrim[data-pos="center"]{background:color-mix(in srgb,var(--s-scrim) 70%,transparent)}

.slide__body{position:absolute;z-index:3;left:0;right:0;padding:7cqw;display:flex;flex-direction:column;gap:3cqw;align-items:flex-start}
.slide__body--bottom{bottom:0}
.slide__body--top{top:0}
.slide__body--center{top:50%;transform:translateY(-50%)}
.slide__rule{width:8cqw;height:.6cqw;background:var(--s-accent);border-radius:2px;flex:none}
.slide__head{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:7cqw;line-height:1.06;letter-spacing:.005em;color:var(--s-ink);text-wrap:balance}
.slide__head em{font-style:normal;color:var(--s-accent)}
.slide__sub{font-family:var(--font-body);font-size:3.4cqw;line-height:1.55;color:var(--s-ink);opacity:.82;max-width:88%;margin:0}
.slide__list{list-style:none;display:flex;flex-direction:column;gap:2.2cqw;font-family:var(--font-body);font-weight:500;font-size:3.8cqw;color:var(--s-ink);margin:.6cqw 0 0}
.slide__list li{position:relative;padding-left:5.4cqw;line-height:1.3}
.slide__list li::before{content:"";position:absolute;left:0;top:.52em;width:1.9cqw;height:1.9cqw;border-radius:2px;background:var(--s-accent)}
.slide__count{position:absolute;top:4cqw;right:4cqw;z-index:4;background:rgba(1,1,16,.6);color:var(--erg-aqua);font-family:var(--font-display);font-weight:700;font-size:2.8cqw;letter-spacing:.08em;padding:1.3cqw 2.8cqw;border-radius:var(--r-pill)}
.slide.is-light .slide__count{background:rgba(3,3,40,.09);color:var(--erg-blue)}

.cta{display:flex;align-items:center;gap:3.4cqw;margin-top:2cqw;padding-top:4cqw;border-top:1px solid color-mix(in srgb,var(--s-ink) 22%,transparent);width:100%}
.cta__face{width:14cqw;height:14cqw;border-radius:var(--r-pill);object-fit:cover;flex:none;box-shadow:0 0 0 .5cqw var(--s-accent)}
.cta__lines{display:flex;flex-direction:column;gap:.7cqw;min-width:0}
.cta__name{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:4cqw;letter-spacing:.02em;color:var(--s-ink)}
.cta__meta{font-family:var(--font-body);font-size:2.9cqw;line-height:1.35;color:var(--s-ink);opacity:.7}
.lockup{position:absolute;z-index:4;top:6cqw;left:7cqw;right:7cqw;display:flex;flex-direction:column;gap:1.6cqw;align-items:flex-start}
.lockup__mark{height:4.4cqw;width:auto}
.lockup__broker{display:inline-flex;align-items:center;gap:1.4cqw;font-family:var(--font-display);font-weight:600;font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--s-ink);opacity:.55}

@media (max-width:900px){
  .builder{grid-template-columns:1fr}
  .editor{border-right:none;border-bottom:1px solid var(--erg-line);min-height:0;order:2}
  .preview{order:1;min-height:0;padding-bottom:32px}
  .phone{position:static}
  .profile{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}*{scroll-behavior:auto}}
</style>
</head>
